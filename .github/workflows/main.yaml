name: Continuous integration

on:
  push:
    branches:
      - master
      - "[0-9]+.[0-9]+"
    tags:
      - "*"
  pull_request:

env:
  HAS_SECRETS: ${{ secrets.HAS_SECRETS }}

permissions:
  contents: read

jobs:
  pre-commit:
    name: Check with pre-commit and Prospector
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    if: "!startsWith(github.event.head_commit.message, '[skip ci] ')"

    outputs:
      success: ${{ steps.success.outputs.success }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python3 -m pip install '--only-binary=:all:' --requirement=ci/requirements.txt

      - name: Print environment information
        run: c2cciutils-env

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: "pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}\npre-commit-"
      - run: pre-commit run --all-files --color=always
      - run: git diff --exit-code --patch > /tmp/pre-commit.patch; git diff --color; git reset --hard || true
        if: failure()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Apply pre-commit fix.patch
          path: /tmp/pre-commit.patch
          retention-days: 1
        if: failure()

      - name: Install with Poetry
        run: poetry install

      - name: Prospector
        run: |
          poetry run prospector --output-format=pylint --direct-tool-stdout

      - id: success
        run: echo "success=true" >> "$GITHUB_OUTPUT"

  main:
    name: Continuous integration
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    outputs:
      success-min: ${{ steps.success.outputs.success-min }}
      success-max: ${{ steps.success.outputs.success-max }}

    strategy:
      fail-fast: false
      matrix:
        # Test the min and max Python versions supported by the project
        include:
          - python-version: "3.10"
            role: min
          # renovate: datasource=python-version depName=python-test-matrix
          - python-version: "3.14"
            role: max

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - run: python3 -m pip install '--only-binary=:all:' --requirement=ci/requirements.txt

      - name: Install with Poetry
        run: poetry install

      - name: Tests
        run: poetry run pytest -vv

      - id: success
        run: echo "success-${{ matrix.role }}=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    needs:
      - main
      - pre-commit
    if: always()

    permissions:
      contents: read
      id-token: write

    steps:
      - run: '[[ "${{ needs.pre-commit.outputs.success }}" == "true" ]]'
      - run: '[[ "${{ needs.main.outputs.success-min }}" == "true" ]]'
      - run: '[[ "${{ needs.main.outputs.success-max }}" == "true" ]]'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python3 -m pip install '--only-binary=:all:' --requirement=ci/requirements.txt

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          cache-python: true
          python-version: "3.13"

      # tag-publish connects itself to PyPI with OpenId Connect, and only when the context publishes.
      - name: Publish
        run: uv run --locked --isolated --project=.github/publish tag-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: git diff --exit-code --patch > /tmp/dpkg-versions.patch; git diff --color; git reset --hard || true
        if: failure()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Update dpkg versions list.patch
          path: /tmp/dpkg-versions.patch
          retention-days: 1
        if: failure()
